name: Deploy Migrations

on:
  push:
    branches:
      - main  # Runs every time you save to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations
        run: |
          supabase link --project-ref ${{ secrets.PROJECT_ID }} -p ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase db push -p ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          # You can add PROJECT_ID as a secret too, or just paste it here
          PROJECT_ID: wtrxwcyjeanclrtjivxc
