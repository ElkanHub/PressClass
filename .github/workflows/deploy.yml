name: Deploy Migrations

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations
        run: |
          # Links your GitHub runner to your specific project
          supabase link --project-ref ${{ secrets.PROJECT_ID }} -p ${{ secrets.SUPABASE_DB_PASSWORD }}
          
          # Pushes the local SQL files to the live database
          supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          # This is the "Master Key" you just added to secrets
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
